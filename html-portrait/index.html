<!DOCTYPE html>
<html lang="en">

<head>
  <title>My Self Portrait</title>

  <style>

    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 70px;
    }

    h1 {
      font-size: 72px;
      margin-bottom: 10px;
    }

    .intro {
      color: gray;
      font-size: 20px;
      margin-bottom: 50px;
    }

    img {
      width: 260px;
      margin-bottom: 40px;
      transition: 0.3s;
    }

    img:hover {
      transform: scale(1.05);
    }

    .word {
      font-size: 36px;
      margin: 32px;
      transition: 0.3s;
      cursor: pointer;
    }

    .word span {
      display: block;
      color: gray;
      font-size: 16px;
      margin-top: 8px;
      opacity: 0;
      transition: 0.3s;
    }

    .word:hover {
      color: red;
      letter-spacing: 5px;
    }

    .word:hover span {
      opacity: 1;
    }

  </style>

</head>


<body>

  <h1>WHO AM I?</h1>

  <p class="intro">
    A self portrait through the things I care about.
  </p>


  <img src="portrait.jpg" alt="Self portrait image">


  <div class="word">
    FILM

    <span>
      Horror, visual storytelling, and cinema.
    </span>
  </div>


  <div class="word">
    GAMES

    <span>
      Competitive games, RPGs, and interactive worlds.
    </span>
  </div>


  <div class="word">
    MUSIC

    <span>
      Hip-hop, rhythm, and sound-driven visuals.
    </span>
  </div>


  <div class="word">
    DESIGN

    <span>
      Film, and visual design.
    </span>
  </div>


  <div class="word">
    CARS

    <span>
      Machines, driving, and performance.
    </span>
  </div>

</body>

</html>
